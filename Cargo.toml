[package]
name = "nebula-reader"
version = "0.1.5"
edition = "2021"
license = "GPL-3.0-only"
description = "Nebula Reader: a comic, manga and ebook reader for COSMIC and other desktops"

[dependencies]
env_logger = "0.11"
log = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "sync", "time"] }
url = "2.5"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
compress-tools = "0.15"
zip = "2"
flate2 = "1"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# COSMIC theme files; the same ron libcosmic uses.
ron = "0.12"
# Local time for the full-screen clock.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
rusqlite = { version = "0.31", features = ["bundled"] }
quick-xml = "0.37"
regex = "1"

# Fork of pop-os/libcosmic with these patches on top of pop-os/libcosmic:
# 1. Forwards winit's trackpad pinch gesture (WindowEvent::PinchGesture)
#    through iced as mouse::Event::WheelZoomed, which upstream iced drops
#    entirely.
# 2. In image::Viewer, lets a physical mouse wheel zoom without Ctrl (it
#    reports discrete ScrollDelta::Lines, unambiguous with scrolling)
#    while keeping trackpad two-finger scroll (ScrollDelta::Pixels)
#    Ctrl-gated for zoom, since that's ambiguous with panning intent.
# 3. In image::Viewer, trackpad two-finger scroll without Ctrl pans a
#    zoomed-in image instead of doing nothing — free diagonal movement,
#    since x/y move independently.
# 4. In image::Viewer, fixes the pan clamp so dragging/scrolling can't push
#    a zoomed page past its own edge into blank space (was most visible
#    top-to-bottom, since pages are portrait).
# 5. Adds image::Viewer::page(key): when the key changes the zoom is kept
#    but the view starts at the top of the new image (comic page turns).
# 6. Header bar items are vertically centred on whole pixels, so small icons
#    in the header stay sharp.
# 7. In image::Viewer, holding Shift zooms the wheel in quarter-size steps.
# 8. Adds image::Viewer::whole_page(bool): a page turned to with it set (a
#    two-page spread) is zoomed out to fit, and the zoom before it returns
#    on the next page.
# 9. With client_decorations(false) (system title bar: Windows, macOS,
#    KDE) the content keeps square corners and no outline of its own,
#    instead of rounding inside the system's frame.
# 10. A press beside an overlaid context drawer closes it (its overlay
#    covers the whole content, so the app never sees that click).
# Kept in sync with upstream by merging (never rebasing): run
# tools/libcosmic-drift.sh and see "The libcosmic fork" in docs/DEVELOPING.md.
[dependencies.libcosmic]
git = "https://github.com/NotTimm/libcosmic.git"
rev = "1d178e0a9f16ddcd46c41badaee385e91f3f6e20"
default-features = false
features = ["wgpu", "winit", "tokio", "multi-window"]

# Linux gets Wayland, COSMIC's settings daemon and XDG portal dialogs;
# Windows/macOS use plain winit windows and native (rfd) file dialogs.
# Same git/rev as above, so cargo merges these into one libcosmic.
[target.'cfg(target_os = "linux")'.dependencies]
libcosmic = { git = "https://github.com/NotTimm/libcosmic.git", rev = "1d178e0a9f16ddcd46c41badaee385e91f3f6e20", default-features = false, features = ["dbus-config", "wayland", "xdg-portal"] }
# Settings portal (dark mode / accent colour) for the GNOME and KDE looks.
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
libcosmic = { git = "https://github.com/NotTimm/libcosmic.git", rev = "1d178e0a9f16ddcd46c41badaee385e91f3f6e20", default-features = false, features = ["rfd"] }

[target.'cfg(windows)'.build-dependencies]
# Embeds the icon and version info in the .exe (see build.rs).
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
# Dark mode and accent colour for the Windows 11 look.
windows-registry = "0.6"
# Sets the title bar / taskbar icon (see src/app/window_icon.rs) and reads
# the battery (src/platform/status.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
