# Builds the .deb (Ubuntu 24.04) and .rpm (Fedora) packages.
#
# - Pull requests / manual runs: build both and upload them as workflow
#   artifacts (downloadable from the run's summary page).
# - Pushing a tag `vX.Y.Z[-pre]`: same, then create (or update) the GitHub
#   Release for that tag and attach both packages. The tag must match the
#   `version` in Cargo.toml, which is where the package versions come from.
#
# Only the default GITHUB_TOKEN is needed (contents: write, for the release).
name: Release packages

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "res/**"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_FLAGS: --locked

jobs:
  version:
    name: Read version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read version from Cargo.toml
        run: |
          version="$(bash -c 'source packaging/common.sh && version')"
          if [ -z "$version" ]; then
            echo "::error::could not read version from Cargo.toml"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Cargo.toml version: $version"
      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.v.outputs.version }}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${{ steps.v.outputs.version }} (expected v${{ steps.v.outputs.version }})"
            exit 1
          fi

  deb:
    name: Build .deb (Ubuntu 24.04)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config dpkg-dev \
            libxkbcommon-dev libwayland-dev libarchive-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: deb

      - name: Build package
        run: bash packaging/build-deb.sh

      - name: Inspect package
        run: |
          for f in dist/*.deb; do
            dpkg-deb --info "$f"
            dpkg-deb --contents "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-comic-deb
          path: dist/*.deb
          if-no-files-found: error

  rpm:
    name: Build .rpm (Fedora)
    needs: version
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      # git first so actions/checkout makes a real clone (and the rpm
      # changelog can record the commit); tar/zstd for the cargo cache.
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git tar zstd gcc gcc-c++ make pkgconf-pkg-config rpm-build \
            libxkbcommon-devel wayland-devel libarchive-devel openssl-devel

      - uses: actions/checkout@v4

      - name: Mark checkout as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: rpm-fedora

      - name: Build package
        run: bash packaging/build-rpm.sh

      - name: Inspect package
        run: |
          for f in dist/*.rpm; do
            rpm -qip "$f"
            rpm -qlp "$f"
            echo "--- Requires:"
            rpm -qRp "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-comic-rpm
          path: dist/*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, deb, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -l dist

      # Creates the release if it doesn't exist yet; if it does (e.g. a
      # re-run, or a release drafted by hand first), updates it and
      # replaces same-named assets.
      - uses: softprops/action-gh-release@v2
        with:
          name: Cosmic Comic ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.deb
            dist/*.rpm
