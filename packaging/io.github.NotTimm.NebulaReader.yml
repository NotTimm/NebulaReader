# Flatpak manifest.
#
# Builds from the local checkout (`type: dir`) fully offline: every crate,
# including the libcosmic fork's git dependencies, comes from
# cargo-sources.json, which packaging/gen-cargo-sources.sh generates from
# Cargo.lock (it's not committed; regenerate after changing Cargo.lock).
# packaging/flathub/ has the variant that builds from a git tag, for
# submitting to Flathub (which is where the COSMIC Store gets its apps).
app-id: io.github.NotTimm.NebulaReader
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: nebula-reader

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Network access is used only for optional metadata/cover lookups
  # (AniList, ComicVine).
  - --share=network
  # Comics live in the user's own files; the portal handles anything else.
  - --filesystem=home:ro
  - --filesystem=xdg-documents:ro
  - --filesystem=xdg-download:ro
  # Follow the desktop's look: COSMIC's settings daemon
  # and KDE's colour scheme
  - --filesystem=xdg-config/kdeglobals:ro
  - --talk-name=com.system76.CosmicSettingsDaemon

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/nebula-reader/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: nebula-reader
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm0755 target/release/nebula-reader /app/bin/nebula-reader
      - install -Dm0644 res/io.github.NotTimm.NebulaReader.desktop
        /app/share/applications/io.github.NotTimm.NebulaReader.desktop
      - for png in res/icons/hicolor/*/apps/io.github.NotTimm.NebulaReader.png; do
          install -Dm0644 "$png" "/app/share/icons/hicolor/${png#res/icons/hicolor/}";
        done
      - install -Dm0644 res/io.github.NotTimm.NebulaReader.metainfo.xml
        /app/share/metainfo/io.github.NotTimm.NebulaReader.metainfo.xml
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - dist
          - .flatpak-builder
      - cargo-sources.json
