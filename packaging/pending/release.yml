# Builds every package: .deb (Ubuntu 24.04), .rpm (Fedora), AppImage,
# .flatpak bundle, and a portable Windows .zip.
#
# - Pull requests / manual runs: build them all and upload them as workflow
#   artifacts (downloadable from the run's summary page).
# - Pushing a tag `vX.Y.Z[-pre]`, or a manual run with "publish" ticked:
#   same, then create (or update) the GitHub Release `v<version>` and
#   attach every package. The version comes from Cargo.toml; a pushed tag
#   must match it, and a manual publish creates that tag on the commit it
#   ran on.
#
# Only the default GITHUB_TOKEN is needed (contents: write, for the release).
name: Release packages

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "res/**"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release v<Cargo.toml version> from this commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_FLAGS: --locked

jobs:
  version:
    name: Read version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read version from Cargo.toml
        run: |
          version="$(bash -c 'source packaging/common.sh && version')"
          if [ -z "$version" ]; then
            echo "::error::could not read version from Cargo.toml"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Cargo.toml version: $version"
      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.v.outputs.version }}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${{ steps.v.outputs.version }} (expected v${{ steps.v.outputs.version }})"
            exit 1
          fi

  deb:
    name: Build .deb (Ubuntu 24.04)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config dpkg-dev \
            libxkbcommon-dev libwayland-dev libarchive-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: deb

      - name: Build package
        run: bash packaging/build-deb.sh

      - name: Inspect package
        run: |
          for f in dist/*.deb; do
            dpkg-deb --info "$f"
            dpkg-deb --contents "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-comic-deb
          path: dist/*.deb
          if-no-files-found: error

  rpm:
    name: Build .rpm (Fedora)
    needs: version
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      # git first so actions/checkout makes a real clone (and the rpm
      # changelog can record the commit); tar/zstd for the cargo cache.
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git tar zstd gcc gcc-c++ make pkgconf-pkg-config rpm-build \
            libxkbcommon-devel wayland-devel libarchive-devel openssl-devel

      - uses: actions/checkout@v4

      - name: Mark checkout as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: rpm-fedora

      - name: Build package
        run: bash packaging/build-rpm.sh

      - name: Inspect package
        run: |
          for f in dist/*.rpm; do
            rpm -qip "$f"
            rpm -qlp "$f"
            echo "--- Requires:"
            rpm -qRp "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-comic-rpm
          path: dist/*.rpm
          if-no-files-found: error

  appimage:
    name: Build AppImage
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl \
            libxkbcommon-dev libwayland-dev libarchive-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: appimage

      - name: Build AppImage
        run: bash packaging/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-comic-appimage
          path: dist/CosmicComic-*.AppImage
          if-no-files-found: error

  # The Flatpak builds offline, so every crate is listed up front from
  # Cargo.lock. Done here because the Flatpak builder image has no
  # package manager to install the generator's Python dependencies.
  cargo-sources:
    name: Generate cargo-sources.json
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate
        run: |
          pip install aiohttp tomlkit pyyaml
          bash packaging/gen-cargo-sources.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cargo-sources
          path: packaging/cargo-sources.json
          if-no-files-found: error

  flatpak:
    name: Build .flatpak
    needs: [version, cargo-sources]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cargo-sources
          path: packaging

      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          bundle: CosmicComic-${{ needs.version.outputs.version }}-x86_64.flatpak
          manifest-path: packaging/com.tsingel.CosmicComic.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-comic-flatpak
          path: CosmicComic-*.flatpak
          if-no-files-found: error

  windows:
    name: Build Windows .zip
    needs: version
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4

      - name: Point VCPKG_ROOT at the runner's vcpkg
        shell: pwsh
        run: '"VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV'

      # Building libarchive takes a few minutes; keep the result around.
      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/installed
          key: vcpkg-libarchive-x64-windows-v1

      - name: Install libarchive (vcpkg)
        shell: pwsh
        run: vcpkg install "libarchive[core,bzip2,lz4,lzma,zstd]:x64-windows"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Run tests
        shell: pwsh
        env:
          VCPKGRS_DYNAMIC: "1"
        run: |
          $env:PATH = "$env:VCPKG_ROOT\installed\x64-windows\bin;$env:PATH"
          cargo test --release --locked

      - name: Build package
        shell: pwsh
        run: ./packaging/build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-comic-windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [version, deb, rpm, appimage, flatpak, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -l dist

      # Creates the release if it doesn't exist yet; if it does (e.g. a
      # re-run, or a release drafted by hand first), updates it and
      # replaces same-named assets.
      - uses: softprops/action-gh-release@v2
        with:
          # Explicit so a manual publish (not on a tag ref) creates the tag
          # on the commit it built.
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Cosmic Comic ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.flatpak
            dist/*.zip
