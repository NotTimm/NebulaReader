# Flatpak manifest.
#
# Builds from the local checkout (`type: dir`) fully offline: every crate,
# including the libcosmic fork's git dependencies, comes from
# cargo-sources.json, which packaging/gen-cargo-sources.sh generates from
# Cargo.lock (it's not committed; regenerate after changing Cargo.lock).
# packaging/flathub/ has the variant that builds from a git tag, for
# submitting to Flathub (which is where the COSMIC Store gets its apps).
app-id: com.tsingel.CosmicComic
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cosmic-comic

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Network access is used only for optional metadata/cover lookups
  # (AniList, ComicVine).
  - --share=network
  # Comics live in the user's own files; the portal handles anything else.
  - --filesystem=home:ro
  - --filesystem=xdg-documents:ro
  - --filesystem=xdg-download:ro
  # Follow the desktop's look: COSMIC's theme config and settings daemon,
  # and KDE's colour scheme (see src/platform/look.rs).
  - --filesystem=xdg-config/cosmic:ro
  - --filesystem=xdg-config/kdeglobals:ro
  - --talk-name=com.system76.CosmicSettingsDaemon

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/cosmic-comic/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: cosmic-comic
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm0755 target/release/cosmic-comic /app/bin/cosmic-comic
      - install -Dm0644 res/com.tsingel.CosmicComic.desktop
        /app/share/applications/com.tsingel.CosmicComic.desktop
      - for png in res/icons/hicolor/*/apps/com.tsingel.CosmicComic.png; do
          install -Dm0644 "$png" "/app/share/icons/hicolor/${png#res/icons/hicolor/}";
        done
      - install -Dm0644 res/com.tsingel.CosmicComic.metainfo.xml
        /app/share/metainfo/com.tsingel.CosmicComic.metainfo.xml
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - dist
          - .flatpak-builder
      - cargo-sources.json
